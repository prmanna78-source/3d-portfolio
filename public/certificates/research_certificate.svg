<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e12" />
      <stop offset="50%" stop-color="#141721" />
      <stop offset="100%" stop-color="#08090c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="50%" stop-color="#fda085" />
      <stop offset="100%" stop-color="#f6d365" />
    </linearGradient>
    <linearGradient id="borderGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bf953f" />
      <stop offset="25%" stop-color="#fcf6ba" />
      <stop offset="50%" stop-color="#b38728" />
      <stop offset="75%" stop-color="#fbf5b7" />
      <stop offset="100%" stop-color="#aa771c" />
    </linearGradient>
    <radialGradient id="sealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fcf6ba" />
      <stop offset="70%" stop-color="#b38728" />
      <stop offset="100%" stop-color="#543d0e" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="850" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Border -->
  <rect x="30" y="30" width="1140" height="790" fill="none" stroke="url(#borderGold)" stroke-width="4" rx="12" />
  <rect x="42" y="42" width="1116" height="766" fill="none" stroke="url(#borderGold)" stroke-width="1.5" stroke-dasharray="6,4" rx="8" />

  <!-- Corner Ornaments -->
  <g stroke="url(#borderGold)" stroke-width="2" fill="none">
    <path d="M 50,85 L 85,85 L 85,50" />
    <circle cx="85" cy="85" r="4" fill="#fcf6ba" />
    <path d="M 1150,85 L 1115,85 L 1115,50" />
    <circle cx="1115" cy="85" r="4" fill="#fcf6ba" />
    <path d="M 50,765 L 85,765 L 85,800" />
    <circle cx="85" cy="765" r="4" fill="#fcf6ba" />
    <path d="M 1150,765 L 1115,765 L 1115,800" />
    <circle cx="1115" cy="765" r="4" fill="#fcf6ba" />
  </g>

  <!-- Header Section -->
  <g text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif">
    <!-- Icon / Seal Emblem at Top -->
    <circle cx="600" cy="115" r="28" fill="url(#sealGlow)" filter="url(#shadow)"/>
    <polygon points="600,97 608,114 626,114 611,124 617,141 600,130 583,141 589,124 574,114 592,114" fill="#0d0e12" />

    <text x="600" y="180" font-size="14" letter-spacing="6" fill="#bf953f" font-weight="700" text-transform="uppercase">
      INTERNATIONAL CONFERENCE &amp; RESEARCH COUNCIL
    </text>
    <text x="600" y="235" font-size="38" letter-spacing="2" fill="url(#borderGold)" font-weight="800" text-transform="uppercase" filter="url(#shadow)">
      Certificate of Publication
    </text>
    <text x="600" y="270" font-size="15" fill="#a0a5b5" font-weight="400" letter-spacing="1">
      THIS CERTIFICATE IS PROUDLY CONFERRED UPON
    </text>
    
    <!-- Recipient Name -->
    <text x="600" y="340" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="1">
      Ujjwal Manna
    </text>
    <line x1="380" y1="365" x2="820" y2="365" stroke="url(#borderGold)" stroke-width="2" />

    <!-- Paper Title and Presentation Description -->
    <text x="600" y="410" font-size="16" fill="#cbd5e1" font-weight="400" max-width="800">
      for successfully authoring, presenting, and publishing the original peer-reviewed research paper titled:
    </text>

    <rect x="220" y="435" width="760" height="70" rx="8" fill="#181c28" stroke="#333a4d" stroke-width="1"/>
    <text x="600" y="478" font-size="20" font-weight="600" fill="#e5ff00" letter-spacing="0.5">
      &ldquo;AI-Driven Autonomous Quadrotor Systems for Environmental Sensing&rdquo;
    </text>

    <!-- Scope / Venue Note -->
    <text x="600" y="540" font-size="15" fill="#94a3b8">
      Presented at the International Conference on Robotics, AI &amp; Autonomous Systems (ICRAAS 2026)
    </text>
    <text x="600" y="565" font-size="13" fill="#64748b" letter-spacing="0.5">
      Indexed in Scopus / IEEE Digital Library • DOI: 10.1109/ICRAAS.2026.1049281
    </text>
  </g>

  <!-- Signatures and Official Seal at Bottom -->
  <g transform="translate(140, 640)">
    <line x1="0" y1="50" x2="220" y2="50" stroke="#475569" stroke-width="1.5" />
    <text x="110" y="40" text-anchor="middle" font-family="'Inter', sans-serif" font-style="italic" font-size="22" fill="#bf953f">Dr. A. Sharma</text>
    <text x="110" y="72" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff">Conference Chair</text>
    <text x="110" y="90" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Program Committee</text>
  </g>

  <!-- Golden Seal in Center Bottom -->
  <g transform="translate(600, 690)">
    <circle cx="0" cy="0" r="50" fill="url(#sealGlow)" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="43" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#111" letter-spacing="1">VERIFIED</text>
    <text x="0" y="10" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#222" letter-spacing="1.5">OFFICIAL SEAL</text>
    <text x="0" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#111">2026</text>
  </g>

  <g transform="translate(840, 640)">
    <line x1="0" y1="50" x2="220" y2="50" stroke="#475569" stroke-width="1.5" />
    <text x="110" y="40" text-anchor="middle" font-family="'Inter', sans-serif" font-style="italic" font-size="22" fill="#bf953f">Dr. K. Raman</text>
    <text x="110" y="72" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff">Chief Editor &amp; Reviewer</text>
    <text x="110" y="90" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#64748b">Editorial Board</text>
  </g>

  <!-- Serial & Date -->
  <g font-family="'Inter', sans-serif" font-size="12" fill="#64748b">
    <text x="70" y="795">Certificate ID: PUB-2026-9842-UM</text>
    <text x="1130" y="795" text-anchor="end">Issued: March 2026 • Verified Credential</text>
  </g>
</svg>
